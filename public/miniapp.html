<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>Telegram</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light;--bg:#f2f4f7;--panel:#fff;--panel2:#eef1f4;--text:#111820;--muted:#76808b;--line:#dce1e6;--accent:#2481cc;--accent2:#d9edff;--bubble:#fff;--out:#d9edff;--danger:#e34b4b;--shadow:0 10px 30px #0002}
    html[data-theme=dark]{color-scheme:dark;--bg:#0b0c0e;--panel:#151618;--panel2:#202124;--text:#f4f5f6;--muted:#92969d;--line:#2c2e32;--accent:#3a96f4;--accent2:#1e4264;--bubble:#242529;--out:#2d4762;--danger:#ff6464;--shadow:0 12px 34px #0008}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);overflow:hidden}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}.icon{border:0;background:transparent;font-size:22px;padding:8px;border-radius:50%}.icon:active{background:var(--panel2)}
    .app{height:100dvh;min-height:0;display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);background:var(--bg)}
    .main{min-height:0;height:100dvh}.topbar,.composer{flex-shrink:0}.topbar{position:relative;z-index:2}
    .sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.list-head{padding:max(14px,env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:10px}.list-head h1{font-size:22px;margin:0;flex:1;text-align:center}.search{margin:0 14px 10px;background:var(--panel2);border:0;border-radius:22px;padding:11px 16px;width:calc(100% - 28px);outline:0}.chats{overflow:auto;padding-bottom:90px}.chat{display:flex;width:100%;gap:12px;align-items:center;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 14px;text-align:left}.chat:hover,.chat.active{background:var(--panel2)}.avatar{width:54px;height:54px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:var(--accent2);color:var(--accent);font-weight:700;font-size:20px;background-size:cover;background-position:center}.chat-info{min-width:0;flex:1}.chat-row{display:flex;align-items:center;gap:8px}.chat-name{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.chat-time,.chat-id{font-size:12px;color:var(--muted)}.chat-preview{color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .main{display:flex;flex-direction:column;min-width:0;background-color:var(--bg);background-image:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--accent) 7%,transparent) 1px,transparent 1.5px);background-size:28px 28px;background-position:center;background-repeat:repeat}.topbar{height:68px;flex:0 0 auto;background:color-mix(in srgb,var(--panel) 92%,transparent);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:8px 14px;gap:10px;backdrop-filter:blur(16px)}.top-avatar{width:44px;height:44px}.identity{min-width:0;flex:1;text-align:center}.title{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtitle{font-size:12px;color:var(--muted);margin-top:2px}.messages{flex:1;overflow:auto;padding:18px max(16px,calc((100% - 850px)/2));display:flex;flex-direction:column;gap:7px;background:transparent}.empty{margin:auto;color:var(--muted)}.message{position:relative;align-self:flex-start;max-width:min(620px,82%);background:var(--bubble);border-radius:16px 16px 16px 5px;padding:8px 10px;box-shadow:0 1px 2px #0002;white-space:pre-wrap;overflow-wrap:anywhere;touch-action:pan-y}.message.out{align-self:flex-end;background:var(--out);border-radius:16px 16px 5px 16px}.message.selected{outline:3px solid color-mix(in srgb,var(--accent) 65%,transparent)}.message.deleted{opacity:.6;font-style:italic}.message.pinned:before{content:"📌";position:absolute;right:-23px;top:6px}.body:empty{display:none}.meta{font-size:11px;color:var(--muted);text-align:right;margin-top:4px}.edited{margin-left:4px}.media{display:block;max-width:100%;border-radius:12px;margin-bottom:5px}img.media{max-height:520px;object-fit:contain}video.media{width:min(520px,100%);max-height:560px;background:#000}a.file{color:var(--accent);text-decoration:none;padding:10px;background:color-mix(in srgb,var(--accent) 10%,transparent)}.reaction{position:absolute;right:7px;bottom:-13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1px 6px;font-size:15px}
    .audio-card{display:flex;align-items:center;gap:9px;min-width:min(330px,70vw);padding:3px}.audio-play{width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:20px}.audio-range{flex:1;accent-color:var(--accent)}.audio-time{font-size:11px;color:var(--muted);min-width:38px}.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;margin-bottom:5px;overflow:hidden;border-radius:12px}.media-grid>.media{width:100%;height:210px;object-fit:cover;margin:0;border-radius:4px}.reply-preview{border-left:3px solid var(--accent);padding:4px 7px;margin-bottom:5px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .reply-bar{background:var(--panel);border-top:1px solid var(--line);padding:7px 14px;display:flex;align-items:center;gap:10px}.reply-text{border-left:3px solid var(--accent);padding-left:9px;flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.composer{padding:9px 12px max(9px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:8px}.composer textarea{resize:none;max-height:120px;min-height:42px;flex:1;border:0;outline:0;background:var(--panel2);border-radius:22px;padding:11px 15px}.send{border:0;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-size:20px}.attach,.mic{font-size:25px}.mic,.record-bar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}.mic svg{display:block;width:26px;height:26px;pointer-events:none}
    .overlay{position:fixed;inset:0;background:#0008;z-index:30;display:grid;place-items:center;padding:18px}.modal{width:min(430px,100%);max-height:88dvh;overflow:auto;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:18px}.modal h2{margin:0 0 14px;font-size:20px}.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:11px;margin-bottom:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--panel2)}.btn.primary{background:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.preview-grid img,.preview-grid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#000}.context{position:fixed;z-index:40;width:min(310px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px}.reactions{display:flex;justify-content:space-around;font-size:24px;border-bottom:1px solid var(--line);padding:7px}.menu-item{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;font-size:16px}.menu-item:active{background:var(--panel2)}.menu-item.danger{color:var(--danger)}
    .record-bar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:35;width:min(650px,calc(100% - 22px));background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:8px 10px}.record-dot{width:11px;height:11px;border-radius:50%;background:#ff375f;animation:pulse 1s infinite}.record-track{height:3px;background:var(--line);flex:1;overflow:hidden;border-radius:2px}.record-track:after{content:"";display:block;width:35%;height:100%;background:var(--accent);animation:record 1.5s linear infinite}.record-time{min-width:52px;font-variant-numeric:tabular-nums}.record-hint{color:var(--muted);font-size:13px;white-space:nowrap}.record-send{width:46px;height:46px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:22px}.record-bar:not(.locked) .record-send,.record-bar:not(.locked) .danger{display:none}@keyframes pulse{50%{opacity:.3}}@keyframes record{from{transform:translateX(-110%)}to{transform:translateX(310%)}}
    .toast{position:fixed;z-index:60;left:50%;bottom:85px;transform:translateX(-50%);background:#151618;color:#fff;border-radius:18px;padding:8px 14px;font-size:13px}.login{z-index:100;background:var(--bg)}.login .modal{width:min(360px,100%)}.playback{position:fixed;z-index:55;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 20px));display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}.playback input{flex:1;accent-color:var(--accent)}.playback button{border:0;background:var(--panel2);border-radius:50%;width:34px;height:34px}
    @media(max-width:720px){.app{grid-template-columns:1fr}.main{display:none;position:fixed;inset:0;z-index:10}.app.open .sidebar{display:none}.app.open .main{display:flex}.back{display:block!important}.messages{padding:14px 10px}.message{max-width:86%}.topbar{padding-top:max(8px,env(safe-area-inset-top));height:auto;min-height:66px}.desktop-only{display:none!important}.preview-grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:721px){.back{display:none!important}}
  </style>
</head>
<body>
  <div id="login" class="overlay login"><form id="loginForm" class="modal"><h2>Telegram</h2><input id="token" type="password" placeholder="Код доступа" required><button class="btn primary" style="width:100%">Открыть чаты</button><div id="loginError" style="color:var(--danger);margin-top:8px"></div></form></div>
  <div id="app" class="app">
    <aside class="sidebar"><header class="list-head"><h1>Чаты</h1><button id="listMenu" class="icon">⋯</button></header><input id="search" class="search" placeholder="Поиск"><div id="chats" class="chats"></div></aside>
    <main id="chatMain" class="main"><header class="topbar"><button id="back" class="icon back">‹</button><div id="headerAvatar" class="avatar top-avatar"></div><div class="identity"><div id="chatTitle" class="title">Выбери чат</div><div id="chatId" class="subtitle"></div></div><button id="profile" class="icon">⋯</button></header><section id="messages" class="messages"><div class="empty">Выбери чат</div></section><div id="replyBar" class="reply-bar hidden"><div id="replyText" class="reply-text"></div><button id="replyClose" class="icon">×</button></div><form id="composer" class="composer hidden"><button id="attach" class="icon attach" type="button">📎</button><textarea id="messageText" rows="1" placeholder="Сообщение"></textarea><button id="voice" class="icon mic" type="button" aria-label="Записать голосовое"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-3.07A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z"/></svg></button><button id="send" class="send hidden" type="submit">↑</button></form><input id="fileInput" type="file" multiple hidden><input id="avatarInput" type="file" accept="image/*" hidden><input id="wallpaperInput" type="file" accept="image/*" hidden><input id="globalWallpaperInput" type="file" accept="image/*" hidden></main>
  </div>
  <div id="context" class="context hidden"></div><div id="modalRoot"></div><div id="playback" class="playback hidden"><button id="playbackToggle">❚❚</button><button id="playbackSpeed">1×</button><input id="playbackProgress" type="range" min="0" value="0" step="0.1"><span id="playbackTime">0:00</span><button id="playbackClose">×</button></div><div id="recordBar" class="record-bar hidden"><span class="record-dot"></span><span id="recordTime" class="record-time">0:00</span><div class="record-track"></div><span id="recordHint" class="record-hint">Вверх — закрепить</span><button id="recordCancel" class="btn danger">Отмена</button><button id="recordSend" class="record-send">↑</button></div><div id="toast" class="toast hidden"></div>
<script>
const state={token:localStorage.getItem('bridgePanelToken')||'',accountId:new URLSearchParams(location.search).get('accountId')||'',chats:[],chatsSignature:'',active:null,messages:[],signature:'',reply:null,selected:new Set(),context:null,theme:localStorage.getItem('bridgeTheme')||'dark',hasMore:false,loadingHistory:false,followBottom:true,historyArmed:false};const el=id=>document.getElementById(id);document.documentElement.dataset.theme=state.theme;
async function api(path,options={}){const headers={'x-panel-token':state.token,...(state.accountId?{'x-account-id':state.accountId}:{}),...(options.headers||{})};if(options.body)headers['content-type']='application/json';const r=await fetch(path,{...options,headers});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||`HTTP ${r.status}`);return b}
async function upload(path,form){const r=await fetch(path,{method:'POST',headers:{'x-panel-token':state.token,...(state.accountId?{'x-account-id':state.accountId}:{})},body:form});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||`HTTP ${r.status}`);return b}
const urls=new Map();async function mediaUrl(media){if(urls.has(media.id))return urls.get(media.id);const r=await fetch(`/api/media/${encodeURIComponent(media.id)}`,{headers:{'x-panel-token':state.token,...(state.accountId?{'x-account-id':state.accountId}:{})}});if(!r.ok)throw Error('Файл недоступен');const u=URL.createObjectURL(await r.blob());urls.set(media.id,u);return u}
function avatar(node,chat){node.textContent=(chat.effectiveName||'?')[0].toUpperCase();node.style.backgroundImage='';if(chat.avatar)mediaUrl(chat.avatar).then(u=>{node.textContent='';node.style.backgroundImage=`url(${u})`}).catch(()=>{})}
function time(ts){return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function preview(m){if(!m)return'Нет сообщений';if(m.media)return m.type||'Вложение';return m.text||'Сообщение'}
function renderChats(){const q=el('search').value.trim().toLowerCase();const list=state.chats.filter(c=>`${c.effectiveName} ${c.telegramChatId}`.toLowerCase().includes(q));el('chats').replaceChildren(...list.map(c=>{const b=document.createElement('button');b.className=`chat${state.active?.telegramChatId===c.telegramChatId?' active':''}`;b.innerHTML='<div class="avatar"></div><div class="chat-info"><div class="chat-row"><div class="chat-name"></div><div class="chat-time"></div></div><div class="chat-preview"></div><div class="chat-id"></div></div>';avatar(b.querySelector('.avatar'),c);b.querySelector('.chat-name').textContent=c.effectiveName;b.querySelector('.chat-time').textContent=c.lastMessage?time(c.lastMessage.createdAt):'';b.querySelector('.chat-preview').textContent=preview(c.lastMessage);b.querySelector('.chat-id').textContent=`ID: ${c.telegramChatId}${c.muted?' · скрыт':''}`;b.onclick=()=>openChat(c.telegramChatId);return b}))}
let activeAudio=null,activeAudioButton=null;function stopActiveAudio(){if(activeAudio){activeAudio.pause();activeAudio.currentTime=0}if(activeAudioButton)activeAudioButton.textContent='▶';activeAudio=null;activeAudioButton=null;el('playback').classList.add('hidden');el('playbackSpeed').textContent='1×'}function audioCard(url){const wrap=document.createElement('div');wrap.className='audio-card';wrap.innerHTML='<button class="audio-play">▶</button><input class="audio-range" type="range" min="0" value="0" step="0.1"><span class="audio-time">0:00</span>';const a=new Audio(url),play=wrap.children[0],range=wrap.children[1],label=wrap.children[2];play.onclick=e=>{e.stopPropagation();if(activeAudio&&activeAudio!==a)stopActiveAudio();activeAudio=a;activeAudioButton=play;el('playback').classList.remove('hidden');a.paused?a.play():a.pause()};a.onplay=()=>{play.textContent='❚❚';el('playbackToggle').textContent='❚❚'};a.onpause=()=>{play.textContent='▶';el('playbackToggle').textContent='▶'};a.onended=stopActiveAudio;a.onloadedmetadata=()=>{range.max=a.duration||0;el('playbackProgress').max=a.duration||0};a.ontimeupdate=()=>{range.value=a.currentTime;el('playbackProgress').value=a.currentTime;const value=`${Math.floor(a.currentTime/60)}:${String(Math.floor(a.currentTime%60)).padStart(2,'0')}`;label.textContent=value;el('playbackTime').textContent=value};range.oninput=()=>a.currentTime=range.value;return wrap}
async function attachMedia(box,m){const type=(m.mimeType||'').toLowerCase(),direct=`/api/media/${encodeURIComponent(m.id)}?token=${encodeURIComponent(state.token)}${state.accountId?`&accountId=${encodeURIComponent(state.accountId)}`:''}`;let u;try{u=await mediaUrl(m)}catch{return}let n;if(m.kind==='image'||type.startsWith('image/')){n=document.createElement('img');n.loading='lazy';n.src=u;n.className='media';n.onload=()=>state.followBottom&&(el('messages').scrollTop=el('messages').scrollHeight)}else if(m.kind==='video'||type.startsWith('video/')){n=document.createElement('video');n.preload='metadata';n.src=u;n.controls=true;n.playsInline=true;n.className='media';n.onloadedmetadata=()=>state.followBottom&&(el('messages').scrollTop=el('messages').scrollHeight)}else if(m.kind==='audio'||m.kind==='voice'||type.startsWith('audio/'))n=audioCard(u);else{n=document.createElement('a');n.href=direct;n.target='_blank';n.rel='noopener';n.className='media file';n.textContent=`📎 ${m.fileName}`;if(type!=='application/pdf')n.download=m.fileName}box.prepend(n)}
function bindLongPress(node,m){let timer;node.oncontextmenu=e=>{e.preventDefault();showContext(m,e.clientX||innerWidth/2,e.clientY||innerHeight/2)};node.addEventListener('touchstart',e=>{const t=e.touches[0];timer=setTimeout(()=>showContext(m,t.clientX,t.clientY),520)},{passive:true});node.addEventListener('touchend',()=>clearTimeout(timer));node.addEventListener('touchmove',()=>clearTimeout(timer))}
async function renderMessages(messages,{preserve=false}={}){state.messages=messages;if(!messages.length){el('messages').innerHTML='<div class="empty">Сообщений пока нет</div>';return}const root=el('messages'),oldTop=root.scrollTop,oldHeight=root.scrollHeight,near=oldHeight-oldTop-root.clientHeight<120;const groups=[];for(const m of messages){const last=groups.at(-1);if(m.mediaGroupId&&last?.key===m.mediaGroupId)last.items.push(m);else groups.push({key:m.mediaGroupId,items:[m]})}const nodes=groups.map(group=>{const m=group.items[0],d=document.createElement('div');d.className=`message ${m.direction}${m.deletedAt?' deleted':''}${m.pinned?' pinned':''}${state.selected.has(m.id)?' selected':''}`;d.innerHTML='<div class="body"></div><div class="meta"></div>';const replied=messages.find(x=>x.telegramMessageId===m.replyToMessageId);if(m.replyToMessageId){const q=document.createElement('div');q.className='reply-preview';q.textContent=`↩ ${replied?.text||replied?.type||'Сообщение'}`;d.prepend(q)}d.querySelector('.body').textContent=m.deletedAt?'Сообщение удалено':(group.items.map(x=>x.text).find(Boolean)||'');d.querySelector('.meta').innerHTML=`${time(m.createdAt)}${m.editedAt?'<span class="edited"> изменено</span>':''}`;if(group.items.length>1){const grid=document.createElement('div');grid.className='media-grid';d.prepend(grid);[...group.items].reverse().forEach(x=>x.media&&!x.deletedAt&&attachMedia(grid,x.media))}else if(m.media&&!m.deletedAt)attachMedia(d,m.media);if(m.reaction){const r=document.createElement('span');r.className='reaction';r.textContent=m.reaction;d.append(r)}bindLongPress(d,m);d.onclick=()=>{if(state.selected.size){state.selected.has(m.id)?state.selected.delete(m.id):state.selected.add(m.id);renderMessages(state.messages,{preserve:true})}};return d});root.replaceChildren(...nodes);if(preserve)root.scrollTop=root.scrollHeight-oldHeight+oldTop;else if(near)requestAnimationFrame(()=>root.scrollTop=root.scrollHeight);else root.scrollTop=oldTop}
async function applyWallpaper(chat){const main=el('chatMain');let u='';if(chat?.wallpaper){try{u=await mediaUrl(chat.wallpaper)}catch{}}if(!u)u=localStorage.getItem(`bridgeGlobalWallpaper:${state.theme}`)||`/assets/wallpaper-${state.theme}.jpg`;main.style.backgroundImage=`url(${u})`;main.style.backgroundSize='cover';main.style.backgroundPosition='center';main.style.backgroundRepeat='no-repeat';main.style.backgroundAttachment='fixed'}
async function loadChats(force=false){const chats=(await api('/api/chats')).chats,sig=chats.map(c=>`${c.telegramChatId}:${c.effectiveName}:${c.muted}:${c.lastMessage?.id}:${c.lastMessage?.editedAt}`).join('|');state.chats=chats;if(force||sig!==state.chatsSignature){state.chatsSignature=sig;renderChats()}}
async function openChat(id,force=true){const d=await api(`/api/chats/${id}/messages?limit=60`),changedChat=state.active?.telegramChatId!==d.chat.telegramChatId;if(changedChat)state.historyArmed=false;state.active=d.chat;state.hasMore=d.hasMore;if(force)el('app').classList.add('open');if(force||changedChat){el('chatTitle').textContent=d.chat.effectiveName;el('chatId').textContent=`ID: ${d.chat.telegramChatId}`;avatar(el('headerAvatar'),d.chat);applyWallpaper(d.chat);el('composer').classList.remove('hidden')}const combined=changedChat?d.messages:[...new Map([...state.messages,...d.messages].map(m=>[m.id,m])).values()].sort((a,b)=>a.createdAt-b.createdAt).slice(-5000);const sig=combined.map(m=>`${m.id}:${m.editedAt}:${m.deletedAt}:${m.pinned}:${m.reaction}`).join('|');if(force||sig!==state.signature){state.signature=sig;await renderMessages(combined)}if(force)renderChats()}
async function loadOlder(){if(!state.active||!state.hasMore||state.loadingHistory||state.messages.length>=5000)return;state.loadingHistory=true;try{const before=state.messages[0]?.createdAt||Date.now(),d=await api(`/api/chats/${state.active.telegramChatId}/messages?limit=500&before=${before}`);state.hasMore=d.hasMore;const combined=[...new Map([...d.messages,...state.messages].map(m=>[m.id,m])).values()].sort((a,b)=>a.createdAt-b.createdAt).slice(-5000);await renderMessages(combined,{preserve:true})}finally{state.loadingHistory=false}}
function toast(s){el('toast').textContent=s;el('toast').classList.remove('hidden');setTimeout(()=>el('toast').classList.add('hidden'),1500)}
function closeModal(){el('modalRoot').innerHTML=''}
function modal(title,content,actions){el('modalRoot').innerHTML=`<div class="overlay"><div class="modal"><h2>${title}</h2><div class="modal-content">${content}</div><div class="modal-actions">${actions}</div></div></div>`;el('modalRoot').querySelector('.overlay').onclick=e=>{if(e.target===e.currentTarget)closeModal()}}
function profileMenu(){if(!state.active)return;modal('Настройки чата',`<button id="pCopy" class="menu-item">Копировать ID</button><button id="pName" class="menu-item">Изменить имя</button><button id="pAvatar" class="menu-item">Изменить аватарку</button><button id="pAvatarClear" class="menu-item">Удалить аватарку</button><button id="pWallpaper" class="menu-item">Выбрать обои</button><button id="pWallpaperClear" class="menu-item">Поставить обои по умолчанию</button><button id="pClear" class="menu-item danger">Очистить чат</button>`,`<button id="pClose" class="btn">Закрыть</button>`);el('pCopy').onclick=()=>navigator.clipboard.writeText(state.active.telegramChatId).then(()=>toast('ID скопирован'));el('pName').onclick=renameModal;el('pAvatar').onclick=()=>el('avatarInput').click();el('pAvatarClear').onclick=async()=>{try{const id=state.active.telegramChatId;await api(`/api/chats/${id}/avatar`,{method:'DELETE'});state.active={...state.active,avatar:null};avatar(el('headerAvatar'),state.active);closeModal();await loadChats(true);toast('Аватарка удалена')}catch(e){alert(e.message)}};el('pWallpaper').onclick=()=>el('wallpaperInput').click();el('pWallpaperClear').onclick=async()=>{try{const id=state.active.telegramChatId;await api(`/api/chats/${id}/wallpaper`,{method:'DELETE'});closeModal();state.active={...state.active,wallpaper:null};applyWallpaper(state.active);await loadChats(true);toast('Установлены обои по умолчанию')}catch(e){alert(e.message)}};el('pClear').onclick=()=>{modal('Очистить чат?','История исчезнет только из мини-приложения. В Telegram сообщения останутся.',`<button id="clearCancel" class="btn">Отмена</button><button id="clearOk" class="btn danger">Очистить</button>`);el('clearCancel').onclick=closeModal;el('clearOk').onclick=async()=>{await api(`/api/chats/${state.active.telegramChatId}/messages`,{method:'DELETE'});state.messages=[];state.signature='';closeModal();await openChat(state.active.telegramChatId,true);toast('Чат очищен')}};el('pClose').onclick=closeModal}
function listSettings(){modal('Настройки',`<button id="lTheme" class="menu-item">${state.theme==='dark'?'Светлая':'Тёмная'} тема</button><button id="lWallpaper" class="menu-item">Обои по умолчанию для этой темы</button><button id="lWallpaperReset" class="menu-item">Вернуть стандартные обои</button><button id="lLimit" class="menu-item">Лимит сообщений</button>`,`<button id="lClose" class="btn">Закрыть</button>`);el('lTheme').onclick=()=>{setTheme(state.theme==='dark'?'light':'dark');closeModal()};el('lWallpaper').onclick=()=>el('globalWallpaperInput').click();el('lWallpaperReset').onclick=()=>{localStorage.removeItem(`bridgeGlobalWallpaper:${state.theme}`);applyWallpaper(state.active);closeModal();toast('Стандартные обои восстановлены')};el('lLimit').onclick=historyLimitModal;el('lClose').onclick=closeModal}
async function historyLimitModal(){const settings=await api('/api/settings');modal('Лимит сообщений',`<input id="historyLimit" type="number" min="1" max="10000" value="${settings.chatHistoryLimit}"><div style="color:var(--muted);font-size:13px">Старые сообщения удаляются только из мини-приложения. Telegram не изменяется.</div>`,`<button id="limitCancel" class="btn">Отмена</button><button id="limitSave" class="btn primary">Сохранить</button>`);el('limitCancel').onclick=closeModal;el('limitSave').onclick=async()=>{try{const value=Number(el('historyLimit').value);await api('/api/settings',{method:'PATCH',body:JSON.stringify({chatHistoryLimit:value})});closeModal();if(state.active)await openChat(state.active.telegramChatId,true);toast(`Лимит: ${value}`)}catch(e){alert(e.message)}}}
function renameModal(){modal('Изменить имя','<input id="nameValue" placeholder="Имя контакта">',`<button id="nameCancel" class="btn">Отмена</button><button id="nameSave" class="btn primary">Сохранить</button>`);el('nameValue').value=state.active.customName||'';el('nameCancel').onclick=closeModal;el('nameSave').onclick=async()=>{const d=await api(`/api/chats/${state.active.telegramChatId}`,{method:'PATCH',body:JSON.stringify({name:el('nameValue').value})});closeModal();state.active=d.chat;await loadChats();await openChat(d.chat.telegramChatId)}}
function setTheme(t){state.theme=t;document.documentElement.dataset.theme=t;localStorage.setItem('bridgeTheme',t);applyWallpaper(state.active)}
function showContext(m,x,y){state.context=m;const c=el('context');c.innerHTML='<div class="reactions"><button>❤️</button><button>👍</button><button>👎</button><button>🔥</button><button>🥰</button><button>👏</button></div><button data-a="reply" class="menu-item">↩ Ответить</button><button data-a="copy" class="menu-item">▣ Копировать</button><button data-a="save" class="menu-item">⇩ Сохранить</button><button data-a="edit" class="menu-item">✎ Изменить</button><button data-a="pin" class="menu-item">⌖ Закрепить</button><button data-a="forward" class="menu-item">➜ Переслать</button><button data-a="delete" class="menu-item danger">⌫ Удалить</button><button data-a="select" class="menu-item">◉ Выбрать</button>';c.classList.remove('hidden');c.style.left=`${Math.max(12,Math.min(x,innerWidth-322))}px`;c.style.top=`${Math.max(12,Math.min(y,innerHeight-c.offsetHeight-12))}px`;c.querySelectorAll('.reactions button').forEach(b=>b.onclick=async()=>{await api(`/api/messages/${m.id}`,{method:'PATCH',body:JSON.stringify({action:'reaction',reaction:b.textContent})});hideContext();await openChat(state.active.telegramChatId)});c.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>contextAction(b.dataset.a,m))}
function hideContext(){el('context').classList.add('hidden')}
async function contextAction(a,m){hideContext();if(a==='reply'){state.reply=m;el('replyText').textContent=m.text||m.type;el('replyBar').classList.remove('hidden')}if(a==='copy'){await navigator.clipboard.writeText(m.text||'');toast('Скопировано')}if(a==='save'&&m.media){const u=await mediaUrl(m.media),q=document.createElement('a');q.href=u;q.download=m.media.fileName;q.click()}if(a==='edit'){if(m.direction!=='out'||m.media)return toast('Можно изменить только своё текстовое сообщение');modal('Изменить сообщение','<textarea id="editValue"></textarea>',`<button id="editCancel" class="btn">Отмена</button><button id="editSave" class="btn primary">Сохранить</button>`);el('editValue').value=m.text||'';el('editCancel').onclick=closeModal;el('editSave').onclick=async()=>{await api(`/api/messages/${m.id}`,{method:'PATCH',body:JSON.stringify({action:'edit',text:el('editValue').value})});closeModal();await openChat(state.active.telegramChatId)}}if(a==='pin'){await api(`/api/messages/${m.id}`,{method:'PATCH',body:JSON.stringify({action:'pin'})});await openChat(state.active.telegramChatId)}if(a==='delete'){modal('Удалить сообщение?','Сообщение будет удалено и в Telegram.',`<button id="delCancel" class="btn">Отмена</button><button id="delOk" class="btn danger">Удалить</button>`);el('delCancel').onclick=closeModal;el('delOk').onclick=async()=>{await api(`/api/messages/${m.id}`,{method:'DELETE'});closeModal();await openChat(state.active.telegramChatId)}}if(a==='select'){state.selected.add(m.id);renderMessages(state.messages)}if(a==='forward')forwardModal(m)}
function forwardModal(m){modal('Переслать',`<div id="forwardChats"></div>`,`<button id="forwardCancel" class="btn">Отмена</button>`);const root=el('forwardChats');root.replaceChildren(...state.chats.map(c=>{const b=document.createElement('button');b.className='menu-item';b.textContent=c.effectiveName;b.onclick=async()=>{await api(`/api/messages/${m.id}/forward`,{method:'POST',body:JSON.stringify({targetChatId:c.telegramChatId})});closeModal();toast('Переслано')};return b}));el('forwardCancel').onclick=closeModal}
function previewFiles(files){const objectUrls=files.map(f=>URL.createObjectURL(f));modal('Отправить файлы',`<div id="previewGrid" class="preview-grid"></div><textarea id="caption" placeholder="Добавить подпись"></textarea>`,`<button id="previewCancel" class="btn">Отмена</button><button id="previewSend" class="btn primary">Отправить</button>`);const grid=el('previewGrid');files.forEach((f,i)=>{let n;if(f.type.startsWith('image/')){n=document.createElement('img');n.src=objectUrls[i]}else if(f.type.startsWith('video/')){n=document.createElement('video');n.src=objectUrls[i];n.controls=true}else{n=document.createElement('div');n.textContent=f.name}grid.append(n)});const clear=()=>{objectUrls.forEach(URL.revokeObjectURL);closeModal()};el('previewCancel').onclick=clear;el('previewSend').onclick=async()=>{el('previewSend').disabled=true;try{for(const[i,f]of files.entries()){toast(`Отправка ${i+1}/${files.length}`);const form=new FormData;form.append('kind','auto');form.append('caption',i? '':el('caption').value);form.append('file',f,f.name);await upload(`/api/chats/${state.active.telegramChatId}/media`,form)}clear();await openChat(state.active.telegramChatId)}catch(e){alert(e.message);el('previewSend').disabled=false}}}
let recorder,voiceChunks=[],recordStarted=0,recordTimer,sendRecording=false,voiceGesture=null;async function startRecording(){if(recorder?.state==='recording')return;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];sendRecording=false;recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&voiceChunks.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(recordTimer);el('recordBar').classList.add('hidden');el('recordBar').classList.remove('locked');voiceGesture=null;if(!sendRecording)return;const blob=new Blob(voiceChunks,{type:recorder.mimeType||'audio/webm'}),form=new FormData;form.append('kind','voice');form.append('caption','');form.append('file',new File([blob],'voice.webm',{type:blob.type}));try{toast('Отправка голосового');await upload(`/api/chats/${state.active.telegramChatId}/media`,form);await openChat(state.active.telegramChatId)}catch(e){alert(e.message)}};recorder.start();recordStarted=Date.now();el('recordBar').classList.remove('hidden');el('recordHint').textContent='Вверх — закрепить';recordTimer=setInterval(()=>{const s=Math.floor((Date.now()-recordStarted)/1000);el('recordTime').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},250);if(voiceGesture?.released&&!voiceGesture.locked){sendRecording=true;recorder.stop()}}catch(e){voiceGesture=null;alert(`Нет доступа к микрофону: ${e.message}`)}}
function lockRecording(){if(!voiceGesture||voiceGesture.locked)return;voiceGesture.locked=true;el('recordBar').classList.add('locked');el('recordHint').textContent='Запись закреплена'}
el('loginForm').onsubmit=async e=>{e.preventDefault();state.token=el('token').value;try{await loadChats(true);localStorage.setItem('bridgePanelToken',state.token);
el('login').classList.add('hidden')}catch(x){el('loginError').textContent=x.message}};
el('search').oninput=renderChats;
el('listMenu').onclick=listSettings;
el('back').onclick=()=>el('app').classList.remove('open');
el('profile').onclick=profileMenu;
el('attach').onclick=()=>el('fileInput').click();
el('fileInput').onchange=()=>{const f=[...el('fileInput').files];
el('fileInput').value='';f.length&&previewFiles(f)};
el('avatarInput').onchange=async()=>{const f=el('avatarInput').files[0];
el('avatarInput').value='';if(!f)return;const form=new FormData;form.append('file',f,f.name);await upload(`/api/chats/${state.active.telegramChatId}/avatar`,form);closeModal();await loadChats(true);await openChat(state.active.telegramChatId)};
el('wallpaperInput').onchange=async()=>{const f=el('wallpaperInput').files[0];
el('wallpaperInput').value='';if(!f)return;const form=new FormData;form.append('file',f,f.name);await upload(`/api/chats/${state.active.telegramChatId}/wallpaper`,form);closeModal();await loadChats(true);await openChat(state.active.telegramChatId)};
el('voice').addEventListener('pointerdown',e=>{e.preventDefault();
el('voice').setPointerCapture?.(e.pointerId);voiceGesture={startX:e.clientX,startY:e.clientY,locked:false,released:false};startRecording()});
el('voice').addEventListener('pointermove',e=>{if(!voiceGesture||voiceGesture.locked)return;if(voiceGesture.startX-e.clientX>75){sendRecording=false;voiceGesture=null;recorder?.stop();toast('Запись отменена');return}if(voiceGesture.startY-e.clientY>65)lockRecording()});
el('voice').addEventListener('pointerup',()=>{if(!voiceGesture)return;voiceGesture.released=true;if(recorder?.state==='recording'&&!voiceGesture.locked){sendRecording=true;recorder.stop();voiceGesture=null}});
el('voice').addEventListener('pointercancel',()=>{if(voiceGesture&&!voiceGesture.locked){sendRecording=false;recorder?.stop();voiceGesture=null}});
el('recordCancel').onclick=()=>{sendRecording=false;voiceGesture=null;recorder?.stop()};
el('recordSend').onclick=()=>{sendRecording=true;voiceGesture=null;recorder?.stop()};
el('replyClose').onclick=()=>{state.reply=null;
el('replyBar').classList.add('hidden')};
el('messageText').oninput=e=>{e.target.style.height='42px';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px';const hasText=Boolean(e.target.value.trim());el('voice').classList.toggle('hidden',hasText);el('send').classList.toggle('hidden',!hasText)};
el('composer').onsubmit=async e=>{e.preventDefault();const text=el('messageText').value.trim();if(!text)return;await api(`/api/chats/${state.active.telegramChatId}/messages`,{method:'POST',body:JSON.stringify({text,replyToMessageId:state.reply?.telegramMessageId})});
el('messageText').value='';el('send').classList.add('hidden');el('voice').classList.remove('hidden');state.reply=null;
el('replyBar').classList.add('hidden');await openChat(state.active.telegramChatId)};
document.addEventListener('click',e=>{if(!el('context').contains(e.target))hideContext()});
document.addEventListener('click',e=>{const link=e.target.closest?.('a.file');if(!link||!link.textContent.toLowerCase().endsWith('.pdf'))return;e.preventDefault();modal('PDF',`<iframe src="${link.href}" style="width:100%;height:70dvh;border:0;border-radius:10px"></iframe>`,`<a class="btn" href="${link.href}" target="_blank">Открыть отдельно</a><button id="pdfClose" class="btn">Закрыть</button>`);el('pdfClose').onclick=closeModal});
el('messages').addEventListener('wheel',()=>state.historyArmed=true,{passive:true});
el('messages').addEventListener('touchstart',()=>state.historyArmed=true,{passive:true});
el('messages').addEventListener('scroll',()=>{const box=el('messages');state.followBottom=box.scrollHeight-box.scrollTop-box.clientHeight<120;if(state.historyArmed&&box.scrollTop<80)loadOlder()},{passive:true});
el('playbackToggle').onclick=()=>{if(!activeAudio)return;activeAudio.paused?activeAudio.play():activeAudio.pause()};
el('playbackSpeed').onclick=()=>{if(!activeAudio)return;const rates=[1,1.5,2],next=rates[(rates.indexOf(activeAudio.playbackRate)+1)%rates.length];activeAudio.playbackRate=next;el('playbackSpeed').textContent=`${next}×`};
el('playbackClose').onclick=stopActiveAudio;
el('playbackProgress').oninput=()=>{if(activeAudio)activeAudio.currentTime=Number(el('playbackProgress').value)};
setInterval(async()=>{if(!state.token||!el('login').classList.contains('hidden'))return;try{await loadChats();if(state.active)await openChat(state.active.telegramChatId,false)}catch{}},5000);
if(state.token)loadChats(true).then(()=>el('login').classList.add('hidden')).catch(()=>localStorage.removeItem('bridgePanelToken'));
el('globalWallpaperInput').onchange=()=>{const f=el('globalWallpaperInput').files[0];el('globalWallpaperInput').value='';if(!f)return;const reader=new FileReader;reader.onload=()=>{try{localStorage.setItem(`bridgeGlobalWallpaper:${state.theme}`,reader.result);applyWallpaper(state.active);closeModal();toast('Обои применены ко всем чатам этой темы')}catch{alert('Файл слишком большой. Выбери изображение меньшего размера.')}};reader.readAsDataURL(f)};
</script></body></html>
