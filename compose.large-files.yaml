services:
  bridge:
    environment:
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
      TELEGRAM_LOCAL_FILES_ROOT: /var/lib/telegram-bot-api
      TELEGRAM_DOWNLOAD_LIMIT_MB: 2000
      TELEGRAM_UPLOAD_LIMIT_MB: 2000
      MEDIA_TRANSFER_TIMEOUT_MINUTES: 720
      MEDIA_DISK_RESERVE_MB: 1024
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    depends_on:
      - telegram-bot-api

  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.1
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:?Add TELEGRAM_API_ID to .env}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:?Add TELEGRAM_API_HASH to .env}"
      TELEGRAM_LOCAL: "1"
      TELEGRAM_VERBOSITY: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped

volumes:
  telegram-bot-api-data:
