name: Import saved project
on:
  push:
    paths:
      - .github/workflows/import-project.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Receive archive and import reviewed source files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          import stat
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.request
          import zipfile
          
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          run_id = os.environ["GITHUB_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          root = Path(tempfile.mkdtemp(prefix="tgmax-import-"))
          os.chmod(root, 0o700)
          
          def api(method, path, data=None):
              body = json.dumps(data).encode() if data is not None else None
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + "/" + path,
                  data=body, method=method,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=40) as response:
                  return json.load(response)
          
          def read_file(path):
              try:
                  result = api("GET", "contents/" + path + "?ref=" + branch)
                  return result, base64.b64decode(result["content"])
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None, None
                  raise
          
          def write_file(path, content, message):
              previous, _ = read_file(path)
              data = {"message": message,
                      "content": base64.b64encode(content).decode(), "branch": branch}
              if previous:
                  data["sha"] = previous["sha"]
              return api("PUT", "contents/" + path, data)
          
          def command(args, cwd=None, data=None, network=False):
              actual = list(args)
              if network:
                  credential = base64.b64encode(("x-access-token:" + token).encode()).decode()
                  actual = ["git", "-c", "http.https://github.com/.extraheader=AUTHORIZATION: basic " + credential] + actual[1:]
              child_env = dict(os.environ)
              child_env.pop("GH_TOKEN", None)
              result = subprocess.run(actual, cwd=cwd, input=data,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                      env=child_env, timeout=240)
              if result.returncode:
                  raise RuntimeError("Command failed: " + args[0] + " " + args[1])
              return result.stdout
          
          try:
              private_key = root / "private.pem"
              command(["openssl", "genpkey", "-algorithm", "RSA", "-pkeyopt",
                       "rsa_keygen_bits:4096", "-out", str(private_key)])
              os.chmod(private_key, 0o600)
              modulus = command(["openssl", "rsa", "-in", str(private_key),
                                 "-noout", "-modulus"]).decode().strip().split("=", 1)[1]
              public_key = {"run_id": run_id, "scheme": "RSA-OAEP-SHA256",
                            "modulus_hex": modulus, "exponent": 65537,
                            "run_url": "https://github.com/" + repo + "/actions/runs/" + run_id}
              write_file("__import__/public-key.json",
                         json.dumps(public_key, indent=2).encode(),
                         "Publish temporary archive import public key")
              print("Temporary public key published. Waiting for encrypted transfer.", flush=True)
              payload = None
              for attempt in range(150):
                  _, content = read_file("__import__/payload.json")
                  if content:
                      candidate = json.loads(content)
                      if str(candidate.get("run_id")) == run_id:
                          payload = candidate
                          break
                  time.sleep(4)
              if payload is None:
                  raise RuntimeError("Timed out waiting for encrypted archive transfer")
              if payload.get("scheme") != "RSA-OAEP-SHA256":
                  raise RuntimeError("Unsupported encryption scheme")
              chunks = payload.get("chunks", [])
              if not 1 <= len(chunks) <= 2000:
                  raise RuntimeError("Invalid encrypted payload size")
              plaintext = bytearray()
              for chunk in chunks:
                  cipher = base64.b64decode(chunk, validate=True)
                  if len(cipher) != 512:
                      raise RuntimeError("Invalid encrypted block size")
                  plaintext.extend(command(
                      ["openssl", "pkeyutl", "-decrypt", "-inkey", str(private_key),
                       "-pkeyopt", "rsa_padding_mode:oaep",
                       "-pkeyopt", "rsa_oaep_md:sha256",
                       "-pkeyopt", "rsa_mgf1_md:sha256"], data=cipher))
              transfer_data = json.loads(plaintext)
              helpers = root / "helpers"
              helpers.mkdir(mode=0o700)
              for name in ("library_file_transfer.py", "library_hosted_apps.py"):
                  (helpers / name).write_text(transfer_data["helpers"][name], encoding="utf-8")
              archive = root / "source.zip"
              try:
                  command(["python3", str(helpers / "library_file_transfer.py"),
                           "materialize", str(archive)],
                          data=json.dumps(transfer_data["transfer"]).encode())
              except Exception:
                  raise RuntimeError("Archive download failed; no project source was published") from None
              print("Archive downloaded with file identity metadata.", flush=True)
              unpacked = root / "unpacked"
              unpacked.mkdir(mode=0o700)
              with zipfile.ZipFile(archive) as bundle:
                  entries = bundle.infolist()
                  if len(entries) > 10000 or sum(item.file_size for item in entries) > 100_000_000:
                      raise RuntimeError("Archive exceeds import limits")
                  seen = set()
                  for item in entries:
                      path = PurePosixPath(item.filename)
                      if path.is_absolute() or ".." in path.parts or "\\" in item.filename:
                          raise RuntimeError("Unsafe archive path")
                      if stat.S_ISLNK(item.external_attr >> 16):
                          raise RuntimeError("Archive symlinks are not imported")
                      if not path.parts or item.is_dir():
                          continue
                      if str(path) in seen:
                          raise RuntimeError("Duplicate archive entry")
                      seen.add(str(path))
                      destination = unpacked.joinpath(*path.parts)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(bundle.read(item))
                      if item.external_attr >> 16 & 0o111:
                          destination.chmod(0o755)
              roots = [p.parent for p in unpacked.rglob("package.json")
                       if "node_modules" not in p.parts and ".git" not in p.parts]
              candidates = [p for p in roots if (p / "src").is_dir()]
              if not candidates:
                  raise RuntimeError("Project package.json and src directory were not found")
              source = min(candidates, key=lambda p: len(p.parts))
              approved = []
              skipped = []
              suspicious = []
              secret_patterns = [
                  re.compile(r"\b\d{5,16}:[A-Za-z0-9_-]{30,}\b"),
                  re.compile(r"\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})\b"),
                  re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
                  re.compile(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b"),
                  re.compile(r"""(?i)(?:MAX_BOT_TOKEN|TELEGRAM_API_HASH)\s*[:=]\s*["']?([A-Za-z0-9:_-]{32,})""")
              ]
              ignored_dirs = {".git", "node_modules", "data", "logs", "__pycache__",
                              ".cache", ".venv", "venv", "sessions"}
              allowed_env = {".env.example", ".env.sample", ".env.template"}
              for path in sorted(source.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(source)
                  name = path.name
                  if (any(part in ignored_dirs for part in relative.parts[:-1])
                          or (name.startswith(".env") and name not in allowed_env)
                          or name in {"bridge.json", ".DS_Store", "Thumbs.db"}
                          or name.endswith((".session", ".session-journal", ".sqlite", ".sqlite3", ".db", ".log", ".pyc"))
                          or relative.parts[:2] == (".github", "workflows")):
                      skipped.append(relative.as_posix())
                      continue
                  data = path.read_bytes()
                  if len(data) > 10_000_000:
                      raise RuntimeError("Unexpected large source file: " + relative.as_posix())
                  if b"\0" not in data[:8192]:
                      text = data.decode("utf-8", errors="replace")
                      for pattern in secret_patterns:
                          for match in pattern.finditer(text):
                              matched = match.group()
                              if not re.search(r"example|dummy|test|your_|placeholder|replace|changeme|0123456789abcdef|AAAAAA", matched, re.I):
                                  suspicious.append(relative.as_posix())
                                  break
                  approved.append((relative, path))
              if suspicious:
                  raise RuntimeError("Potential credentials require review in: " + ", ".join(sorted(set(suspicious))))
              print("Source checks passed: " + str(len(approved)) + " files; excluded " + str(len(skipped)) + ".", flush=True)
              work = root / "repository"
              work.mkdir()
              command(["git", "init", "-q"], cwd=work)
              command(["git", "config", "user.name", "github-actions[bot]"], cwd=work)
              command(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], cwd=work)
              command(["git", "remote", "add", "origin", "https://github.com/" + repo + ".git"], cwd=work)
              command(["git", "fetch", "--depth=1", "origin", branch], cwd=work, network=True)
              target_branch = "import/telegram-max-2.2.0-" + run_id
              command(["git", "checkout", "-b", target_branch, "FETCH_HEAD"], cwd=work)
              for relative, path in approved:
                  destination = work / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, destination)
              command(["git", "add", "--all"], cwd=work)
              command(["git", "commit", "-m", "Import saved Telegram-MAX Bridge 2.2.0 source"], cwd=work)
              commit = command(["git", "rev-parse", "HEAD"], cwd=work).decode().strip()
              command(["git", "push", "origin", "HEAD:refs/heads/" + target_branch], cwd=work, network=True)
              result = {"branch": target_branch, "commit": commit, "imported_files": len(approved),
                        "excluded_files": skipped, "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
                        "package": json.loads((source / "package.json").read_text())}
              write_file("__import__/result.json", json.dumps(result, indent=2).encode(),
                         "Record project archive import result")
              print("Source imported to " + target_branch + " for review and testing.", flush=True)
          finally:
              shutil.rmtree(root, ignore_errors=True)
          
          PY
