name: Prepare dependency fixes
on:
  push:
    paths:
      - .github/workflows/repair-dependencies.yml
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: import/telegram-max-2.2.0-39496413509
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Update Fastify within major version 5
        run: npm install fastify@5.12.7 --save-exact --package-lock-only --ignore-scripts
      - name: Update vulnerable transitive dependencies without major upgrades
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Report updated dependency files
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          console.log('DEPENDENCY_FILES_BEGIN');
          console.log(JSON.stringify({
            packageJson: readFileSync('package.json', 'utf8'),
            packageLock: readFileSync('package-lock.json', 'utf8')
          }));
          console.log('DEPENDENCY_FILES_END');
          JS
      - name: Verify dependency audit
        run: npm audit --omit=dev --json
